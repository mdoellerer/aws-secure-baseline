services:
  web:
    build:
      context: .
    container_name: my-django-api
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOME: /app
      DJANGO_DEBUG: "true"
    volumes:
      - .:/app
      - app_data:/data
volumes:
  app_data: